version: "3.8"

services:
  backend:
    build: ./backend
    container_name: neurasearch-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CHROMA_PATH=/app/chroma_db
      - BM25_INDEX_PATH=/app/bm25_index.pkl
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      - ./tests:/app/tests
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: neurasearch-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
