[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "__pycache__", "migrations", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py312"]
exclude = '''
/(
    \.venv
  | __pycache__
  | migrations
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
